{% extends 'factorio_app/base.html' %}
{% block title %}Новый чертёж{% endblock %}
{% block content %}<main class="form-page"><p class="eyebrow">ПУБЛИКАЦИЯ</p><h1>Поделитесь чертежом</h1><p class="form-lead">Добавьте рабочую схему, чтобы другие игроки могли её найти и обсудить.</p><form method="post" enctype="multipart/form-data" class="site-form">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}</label>{% endfor %}<button class="primary-btn" type="submit">Опубликовать чертёж</button></form></main>{% endblock %}
